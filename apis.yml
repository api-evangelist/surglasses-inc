name: Surglasses Inc.
description: Surglasses Inc. (SURGLASSES) is a medical technology manufacturer of augmented
  reality surgical guidance systems and medical education products. Its portfolio includes
  AR-guided surgical navigation for orthopedic, spine, and neurosurgery procedures (the
  Foresee-X AR surgical glasses), 3D computer surgical navigation and planning software,
  and the Asclepius AI Table and Virtual Dissection Table for anatomy, radiology, and
  histopathology education. Backed by 500 Global. The company operates as a B2B medical-device
  manufacturer and publishes no public developer, API, or SDK surface at this time.
